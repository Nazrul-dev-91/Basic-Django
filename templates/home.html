<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Homepage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }
    header {
      background: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    nav {
      background: #444;
      display: flex;
      justify-content: center;
    }
    nav a {
      color: #fff;
      padding: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      background: #555;
    }
    main {
      padding: 2rem;
      text-align: center;
    }
    footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Homepage</h1>
    <p>A simple starter layout</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>This is a short introduction about yourself or your site.</p>
    </section>

    <section id="services">
      <h2>Services</h2>
      <p>List what you offer here.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: example@email.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Homepage</p>
  </footer>
</body>
</html>
